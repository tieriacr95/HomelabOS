name: HomeLab OS CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: pip install -r backend/requirements.txt -r agent/requirements.txt pytest
      - name: Install restic for encrypted recovery round-trip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - name: Run tests
        env:
          PYTHONPATH: backend:.
          HOMELAB_SETUP_TOKEN: ci-setup-token-for-tests
        run: pytest -q
      - name: Python syntax
        run: python -m compileall -q backend agent scripts
      - name: Validate privileged helper and shell installers
        run: |
          python -m py_compile helpers/package-helper helpers/ssh-audit-helper
          bash -n scripts/install.sh scripts/install_package_helper.sh scripts/install_ssh_audit.sh scripts/backup.sh

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -s dist/assets/app.js
          test -s dist/assets/app.css
          grep -q '/assets/app.js' dist/index.html
          grep -q '/assets/app.css' dist/index.html

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime container
        run: docker build -t homelabos:ci .
