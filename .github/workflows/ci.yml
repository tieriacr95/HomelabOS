name: HomeLab OS CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: pip install -r backend/requirements.txt -r agent/requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: backend:.
          HOMELAB_SETUP_TOKEN: ci-setup-token-for-tests
        run: pytest -q
      - name: Python syntax
        run: python -m compileall -q backend agent scripts

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime container
        run: docker build -t homelabos:ci .
